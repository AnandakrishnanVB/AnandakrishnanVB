  </text>

  <text x="30" y="450">
    <tspan class="muted">03  </tspan>
    <tspan class="value">Hospital Management System</tspan>
  </text>

  <text x="30" y="474">
    <tspan class="muted">04  </tspan>
    <tspan class="value">Airline Management System</tspan>
  </text>


  <!-- learning -->
  <text x="520" y="378">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">learning</tspan>
