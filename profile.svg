  <text x="520" y="402" class="value">
    → Data Structures &amp; Algorithms
  </text>

  <text x="520" y="426" class="value">
    → Machine Learning
  </text>

  <text x="520" y="450" class="value">
    → React / Full-Stack Development
  </text>


  <!-- contact -->
  <text x="520" y="490">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">contact</tspan>
  </text>

  <text x="520" y="514">
    <tspan class="key">github</tspan>
    <tspan class="muted"> → </tspan>
    <tspan class="value">AnandakrishnanVB</tspan>
  </text>

  <text x="520" y="538">
    <tspan class="key">email </tspan>
    <tspan class="muted"> → </tspan>
    <tspan class="value">anandakrishnanvb3000@gmail.com</tspan>
  </text>


  <!-- Final prompt -->
  <text x="30" y="570">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">█</tspan>
