    <tspan class="muted"> → </tspan>
    <tspan class="value">Git, GitHub, VS Code</tspan>
  </text>


  <!-- projects -->
  <text x="30" y="378">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">projects</tspan>
