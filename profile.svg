<svg xmlns="http://www.w3.org/2000/svg"
     width="985"
     height="600"
     viewBox="0 0 985 600"
     font-family="Consolas, 'Courier New', monospace">

  <style>
    .prompt { fill: #3fb950; }
    .path { fill: #58a6ff; }
    .command { fill: #c9d1d9; }
    .key { fill: #ffa657; }
    .value { fill: #a5d6ff; }
    .muted { fill: #616e7f; }
    .output { fill: #c9d1d9; }
  </style>

  <!-- Terminal -->
  <rect width="985" height="600" rx="12" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="985" height="36" rx="12" fill="#21262d"/>
  <rect y="24" width="985" height="12" fill="#21262d"/>

  <!-- Window buttons -->
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>

  <text x="492" y="23"
        text-anchor="middle"
        fill="#8b949e"
        font-size="13">
    AnandakrishnanVB@github
  </text>


  <!-- whoami -->
  <text x="30" y="70">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">whoami</tspan>
  </text>

  <text x="30" y="94" class="output">
    Anandakrishnan VB
  </text>


  <!-- about -->
  <text x="30" y="130">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">cat about.txt</tspan>
  </text>

  <text x="30" y="154" class="output">
    B.Tech CSE student who enjoys learning, building and solving problems.
  </text>

  <text x="30" y="178" class="output">
    Currently exploring software development and machine learning.
  </text>


  <!-- skills -->
  <text x="30" y="218">
    <tspan class="prompt">AnandakrishnanVB</tspan>
    <tspan class="muted">:</tspan>
    <tspan class="path">~</tspan>
    <tspan class="muted">$ </tspan>
    <tspan class="command">skills</tspan>
